<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter · {{ app_name }}</title>
<style>
 *{box-sizing:border-box}
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f3f4f7;color:#1d2330;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
 form{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:360px;box-shadow:0 2px 12px #0001}
 h1{font-size:22px;margin:0 0 20px;text-align:center}
 label{display:block;font-size:14px;color:#555;margin-bottom:14px}
 input{width:100%;padding:10px;border:1px solid #cfd3db;border-radius:8px;font:inherit;margin-top:4px}
 button{width:100%;background:#2257d6;color:#fff;border:0;border-radius:8px;padding:11px;font:inherit;font-weight:600;cursor:pointer;margin-top:6px}
 .err{background:#fde2e2;color:#a12a1e;padding:8px 10px;border-radius:8px;font-size:14px;margin-bottom:14px}
</style></head><body>
<form method="post">
 <p style="text-align:center;font-weight:700;letter-spacing:.03em;margin:0 0 6px;color:#1d4fa0">{{ app_name }}</p>
 <h1>Se connecter</h1>
 {% if error %}<div class="err">{{ error }}</div>{% endif %}
 <label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
 <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
 <button>Se connecter</button>
</form></body></html>
