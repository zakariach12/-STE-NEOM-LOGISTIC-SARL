{% extends "base.html" %}
{% block title %}Mon compte{% endblock %}
{% block body %}
<div class="card" style="max-width:460px;margin:0 auto">
 <h2>Mon compte</h2>
 {% if msg %}<p style="background:#dff5e3;padding:8px 10px;border-radius:8px">{{ msg }}</p>{% endif %}
 {% if error %}<p style="background:#fde2e2;color:#a12a1e;padding:8px 10px;border-radius:8px">{{ error }}</p>{% endif %}
 <form method="post">
  <label>Email de connexion<input name="email" type="email" value="{{ email }}" required></label><br>
  <label>Nouveau mot de passe <span class="muted">(vide = ne pas changer)</span><input name="new_password" type="password" autocomplete="new-password"></label><br>
  <label>Répétez le nouveau mot de passe<input name="confirm_password" type="password" autocomplete="new-password"></label><br>
  <label>Mot de passe actuel <span class="muted">(obligatoire)</span><input name="current_password" type="password" autocomplete="current-password" required></label><br>
  <button>Enregistrer</button>
 </form>
</div>
{% endblock %}
